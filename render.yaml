services:
  - type: web
    name: kkbox-cloud-downloader
    env: python
    region: sgp  # <--- Esto fuerza a Render a desplegar en Singapur (Región soportada por KKBOX)
    buildCommand: ./render_setup.sh
    startCommand: gunicorn app:app
    envVars:
      - key: KKBOX_EMAIL
        sync: false
      - key: KKBOX_PASSWORD
        sync: false
      - key: KKBOX_KC1_KEY
        value: 7f1a68f00b747f4ac1469c72e7ef492c
      - key: KKBOX_SECRET_KEY
        value: 0ff29b7c9bd8fb60a3abd6b3d402b02c
        
