<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKBOX FLAC Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-lg border border-gray-700">
        <div class="flex items-center justify-between mb-2">
            <h1 class="text-xl font-bold text-indigo-400">KKBOX Downloader</h1>
            <span class="bg-green-900 text-green-300 text-xs font-bold px-2.5 py-0.5 rounded border border-green-600">FLAC Lossless</span>
        </div>
        <p class="text-xs text-gray-400 mb-6">Desarrollado por <a href="https://github.com/adrianmejiam" target="_blank" class="text-indigo-400 hover:underline font-semibold">adrianmejiam</a></p>

        <div class="mb-4">
            <label class="block text-gray-300 text-sm font-bold mb-2">URL de KKBOX (Canción / Playlist / Álbum):</label>
            <input type="text" id="url" placeholder="https://www.kkbox.com/..." class="bg-gray-900 border border-gray-700 rounded-lg w-full py-2 px-3 text-gray-200 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button id="downloadBtn" onclick="startDownload()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg w-full transition duration-200 focus:outline-none shadow-md">
            Descargar FLAC en Máxima Calidad
        </button>

        <!-- Contenedor de Progreso y Consola Terminal -->
        <div id="progressContainer" class="mt-6 hidden">
            <div class="flex justify-between mb-1">
                <span id="statusText" class="text-xs font-semibold text-gray-300">Iniciando...</span>
                <span id="percentText" class="text-xs font-semibold text-indigo-400">0%</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-3 mb-4">
                <div id="progressBar" class="bg-indigo-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- Ventana de Consola / Terminal -->
            <div class="bg-black border border-gray-700 rounded-lg p-3 h-44 overflow-y-auto font-mono text-xs text-green-400 shadow-inner" id="consoleBox">
                <div class="text-gray-500">$ esperando solicitud de descarga...</div>
            </div>
        </div>
    </div>

    <footer class="mt-8 text-center text-gray-500 text-xs">
        Creado por <span class="font-bold text-gray-400">adrianmejiam</span> | Desplegado en Render
    </footer>

    <script>
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function startDownload() {
            const urlInput = document.getElementById('url').value.trim();
            const btn = document.getElementById('downloadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const percentText = document.getElementById('percentText');
            const consoleBox = document.getElementById('consoleBox');

            if (!urlInput) {
                alert("Por favor ingresa una URL válida de KKBOX.");
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-50');
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            percentText.innerText = '0%';
            statusText.innerText = 'Iniciando conexión...';
            consoleBox.innerHTML = '<div class="text-indigo-400">[+] Conectando al servidor...</div>';

            try {
                const response = await fetch('/start-download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });
                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error);
                }

                if (result.task_id) {
                    const eventSource = new EventSource(`/check-progress/${result.task_id}`);

                    eventSource.onmessage = function(event) {
                        const data = JSON.parse(event.data);
                        
                        progressBar.style.width = `${data.progress}%`;
                        percentText.innerText = `${data.progress}%`;
                        statusText.innerText = data.status;

                        // Imprimir registros escapados en tiempo real
                        if (data.logs && data.logs.length > 0) {
                            consoleBox.innerHTML = data.logs.map(log => `<div>${escapeHtml(log)}</div>`).join('');
                            consoleBox.scrollTop = consoleBox.scrollHeight;
                        }

                        if (data.download_url) {
                            eventSource.close();
                            btn.disabled = false;
                            btn.classList.remove('opacity-50');
                            consoleBox.innerHTML += '<div class="text-green-300 font-bold">[✔] ¡Descarga completada! Transfiriendo archivo al navegador...</div>';
                            consoleBox.scrollTop = consoleBox.scrollHeight;

                            const link = document.createElement('a');
                            link.href = data.download_url;
                            link.setAttribute('download', '');
                            document.body.appendChild(link);
                            link.click();
                            link.remove();
                        } else if (data.error) {
                            eventSource.close();
                            btn.disabled = false;
                            btn.classList.remove('opacity-50');
                            consoleBox.innerHTML += `<div class="text-red-400 font-bold">[✖] Error: ${escapeHtml(data.status)}</div>`;
                            consoleBox.scrollTop = consoleBox.scrollHeight;
                        }
                    };

                    eventSource.onerror = function() {
                        eventSource.close();
                        btn.disabled = false;
                        btn.classList.remove('opacity-50');
                        statusText.innerText = "Error en la conexión EventSource.";
                    };
                }
            } catch (err) {
                console.error("Error:", err);
                statusText.innerText = err.message || "Error de comunicación con el servidor.";
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
